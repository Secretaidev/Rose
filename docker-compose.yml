version: '3.8'

services:
  bot:
    build: .
    container_name: rose-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - TOKEN=${TOKEN}
      - OWNER_ID=${OWNER_ID}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/rose_bot.db}
      - WEBHOOK=${WEBHOOK:-False}
      - URL=${URL}
      - PORT=${PORT:-8443}
      - WORKERS=${WORKERS:-8}
      - SUDO_USERS=${SUDO_USERS}
      - SUPPORT_USERS=${SUPPORT_USERS}
      - WHITELIST_USERS=${WHITELIST_USERS}
    env_file:
      - .env
